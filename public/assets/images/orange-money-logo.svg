<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Fond noir -->
  <rect width="500" height="500" fill="#000000" rx="60"/>

  <!-- ═══ FLÈCHE BLANCHE — pointe vers le haut-droite ↗ ═══ -->
  <g>
    <!-- Tige diagonale blanche -->
    <line x1="105" y1="360" x2="295" y2="155"
          stroke="white" stroke-width="54" stroke-linecap="round"/>
    <!-- Tête de flèche blanche (triangle plein) -->
    <!-- Barre horizontale du haut (L supérieur blanc) -->
    <rect x="210" y="110" width="125" height="52" rx="26"
          fill="white"/>
    <!-- Barre verticale courte du haut -->
    <rect x="295" y="108" width="52" height="120" rx="26"
          fill="white"/>
  </g>

  <!-- ═══ FLÈCHE ORANGE — pointe vers le bas-gauche ↙ ═══ -->
  <g>
    <!-- Tige diagonale orange -->
    <line x1="395" y1="140" x2="205" y2="345"
          stroke="#FF6200" stroke-width="54" stroke-linecap="round"/>
    <!-- Barre horizontale du bas (L inférieur orange) -->
    <rect x="165" y="338" width="125" height="52" rx="26"
          fill="#FF6200"/>
    <!-- Barre verticale courte du bas -->
    <rect x="153" y="272" width="52" height="120" rx="26"
          fill="#FF6200"/>
  </g>
</svg>

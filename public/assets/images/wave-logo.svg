<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70">
  <!-- Fond bleu Wave -->
  <rect width="200" height="70" rx="10" fill="#00B3E0"/>
  <!-- Corps du pingouin -->
  <ellipse cx="38" cy="42" rx="13" ry="17" fill="#111111"/>
  <ellipse cx="38" cy="44" rx="7" ry="10" fill="white"/>
  <!-- Tête -->
  <circle cx="38" cy="22" r="11" fill="#111111"/>
  <!-- Yeux -->
  <circle cx="34" cy="20" r="2.2" fill="white"/>
  <circle cx="42" cy="20" r="2.2" fill="white"/>
  <circle cx="34" cy="20" r="1" fill="#111"/>
  <circle cx="42" cy="20" r="1" fill="#111"/>
  <!-- Bec orange -->
  <ellipse cx="38" cy="26" rx="3.5" ry="2" fill="#FF8C00"/>
  <!-- Aile gauche levée -->
  <ellipse cx="24" cy="37" rx="6" ry="11" fill="#111111" transform="rotate(-30 24 37)"/>
  <!-- Aile droite -->
  <ellipse cx="52" cy="40" rx="5" ry="10" fill="#111111" transform="rotate(15 52 40)"/>
  <!-- Pattes -->
  <ellipse cx="33" cy="59" rx="5" ry="2.5" fill="#FF8C00"/>
  <ellipse cx="43" cy="59" rx="5" ry="2.5" fill="#FF8C00"/>
  <!-- Texte wave -->
  <text x="130" y="46" font-family="Arial Black, Helvetica, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">wave</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Fond bleu Wave -->
  <rect width="500" height="500" fill="#44C9EC"/>

  <!-- ── Corps du pingouin ── -->
  <!-- Corps principal noir -->
  <ellipse cx="255" cy="295" rx="100" ry="130" fill="#111111"/>
  <!-- Ventre blanc -->
  <ellipse cx="255" cy="308" rx="60" ry="82" fill="white"/>

  <!-- Tête -->
  <circle cx="255" cy="155" r="78" fill="#111111"/>

  <!-- Yeux blancs -->
  <circle cx="226" cy="142" r="18" fill="white"/>
  <circle cx="284" cy="142" r="18" fill="white"/>
  <!-- Pupilles -->
  <circle cx="230" cy="144" r="9" fill="#111111"/>
  <circle cx="288" cy="144" r="9" fill="#111111"/>

  <!-- Bec orange (souriant) -->
  <path d="M 228 178 Q 255 200 282 178 Q 255 192 228 178 Z" fill="#FF8C00"/>
  <ellipse cx="255" cy="182" rx="27" ry="10" fill="#FF8C00"/>

  <!-- Aile gauche levée (qui salue) -->
  <path d="M 158 230 C 130 210 108 160 125 120 C 140 90 165 100 175 130 C 185 155 178 195 165 215 Z" fill="#111111"/>

  <!-- Aile droite vers le bas -->
  <path d="M 350 240 C 375 220 390 260 380 295 C 373 320 355 330 345 305 C 336 280 338 255 350 240 Z" fill="#111111"/>

  <!-- Pattes/pieds orange -->
  <ellipse cx="225" cy="418" rx="38" ry="22" fill="#FF8C00"/>
  <ellipse cx="288" cy="418" rx="38" ry="22" fill="#FF8C00"/>

  <!-- Bas du corps couvre les pattes -->
  <ellipse cx="255" cy="400" rx="100" ry="35" fill="#111111"/>

  <!-- ── Texte "wave" ── -->
  <text x="250" y="478"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="82"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2">wave</text>
</svg>
